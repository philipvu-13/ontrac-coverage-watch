version: 2

models:
  - name: fct_zip_surcharge_changes
    columns:
      - name: zip5
        data_tests:
          - not_null
      - name: change_type
        data_tests:
          - not_null
          - accepted_values:
              values: ['added', 'removed', 'tier_changed']

  - name: fct_zip_coverage
    columns:
      - name: zip5
        data_tests:
          - not_null
      - name: confidence
        data_tests:
          - not_null
          - accepted_values:
              values: ['confirmed', 'inferred', 'inferred_ambiguous']